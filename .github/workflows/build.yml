name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Scaffolding project
        run: |
          mv lib lib_backup
          flutter create --platforms=ios --org com.pixelplayer --project-name pixel_player .
          rm -rf lib
          mv lib_backup lib
          flutter pub add just_audio file_picker

      - name: Fix iOS Target and Permissions
        run: |
          # Поднимаем минимальную версию iOS до 13.0 для just_audio
          sed -i '' "s/# platform :ios, '12.0'/platform :ios, '13.0'/g" ios/Podfile || true
          sed -i '' "s/platform :ios, '12.0'/platform :ios, '13.0'/g" ios/Podfile || true
          
          # Фоновое воспроизведение
          plutil -insert UIBackgroundModes -xml "<array><string>audio</string></array>" ios/Runner/Info.plist || true

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Build iOS Application
        run: |
          flutter build ios --release --no-codesign

      - name: Package into IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r PixelPlayer.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PixelPlayer-IPA
          path: PixelPlayer.ipa
