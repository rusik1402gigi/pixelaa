name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Scaffolding project
        run: |
          mv lib lib_backup
          flutter create --platforms=ios --org com.pixelplayer --project-name pixel_player .
          rm -rf lib
          mv lib_backup lib
          flutter pub add just_audio file_picker

      - name: Prepare iOS Config and Pods
        run: |
          # 1. Заставляем Flutter сгенерировать Podfile и связать зависимости
          flutter build ios --config-only --no-codesign

          # 2. Повышаем версию iOS до 13.0 для работы аудиобиблиотек
          sed -i '' "s/# platform :ios, '12.0'/platform :ios, '13.0'/g" ios/Podfile || true
          sed -i '' "s/platform :ios, '12.0'/platform :ios, '13.0'/g" ios/Podfile || true

          # 3. Обновляем поды (теперь Podfile точно на месте)
          cd ios
          pod install
          cd ..

          # 4. Включаем фоновый звук
          plutil -insert UIBackgroundModes -xml "<array><string>audio</string></array>" ios/Runner/Info.plist || true

      - name: Build Application (Xcode)
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios_derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package into IPA
        run: |
          APP_PATH=$(find build -name "Runner.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r PixelPlayer.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PixelPlayer-IPA
          path: PixelPlayer.ipa
